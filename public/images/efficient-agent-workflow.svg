<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">A bounded hybrid AI workflow</title><desc id="desc">Authorize and validate, route with rules or small ML, select deterministic or language-model execution, optionally delegate bounded parallel tasks, validate evidence, escalate to a person when required, then commit and measure.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#49766a"/></marker><style>text{font-family:Arial,sans-serif;fill:#233332;text-anchor:middle;font-size:15px}.small{font-size:12px;fill:#536563}.box{fill:#fff;stroke:#acc4b8;stroke-width:1.5}.path{fill:none;stroke:#49766a;stroke-width:1.5;marker-end:url(#arrow)}</style></defs><rect width="760" height="650" fill="#f5f7f1" rx="16"/><text x="380" y="35" font-weight="bold">Use the least complex path that meets the goal</text><rect class="box" x="220" y="55" width="320" height="57" rx="8"/><text x="380" y="79">Authorize + validate</text><text class="small" x="380" y="98">Tenant scope · task contract · budget</text><path class="path" d="M380 112V137"/><rect class="box" x="220" y="140" width="320" height="55" rx="8"/><text x="380" y="163">Route with rules or small ML</text><text class="small" x="380" y="182">Task type · risk · measured uncertainty</text><path class="path" d="M300 195V220H130V245M380 195V245M460 195V220H630V245"/><rect class="box" x="30" y="248" width="200" height="62" rx="8"/><text x="130" y="273">Rules / ML / tools</text><text class="small" x="130" y="293">Structured, known tasks</text><rect class="box" x="280" y="248" width="200" height="62" rx="8"/><text x="380" y="273">Small language model</text><text class="small" x="380" y="293">Bounded language work</text><rect class="box" x="530" y="248" width="200" height="62" rx="8"/><text x="630" y="273">Stronger model</text><text class="small" x="630" y="293">Complex reasoning</text><path class="path" d="M130 310V350H380V375M380 310V375M630 310V350H380"/><rect class="box" x="190" y="378" width="380" height="60" rx="8"/><text x="380" y="403">Optional bounded collaboration</text><text class="small" x="380" y="424">Independent tasks · scoped tools · shared result contract</text><path class="path" d="M380 438V463"/><rect class="box" x="190" y="466" width="380" height="57" rx="8"/><text x="380" y="489">Validate outcome + evidence</text><text class="small" x="380" y="509">Checks first · model review as supplementary evidence</text><path class="path" d="M380 523V554M570 495H635V405H574"/><text class="small" x="665" y="445">Bounded retry</text><text class="small" x="665" y="462">or human</text><rect class="box" x="190" y="557" width="380" height="60" rx="8"/><text x="380" y="582">Approval → commit → measure</text><text class="small" x="380" y="603">Authorized writes · idempotency · quality and cost feedback</text></svg>
